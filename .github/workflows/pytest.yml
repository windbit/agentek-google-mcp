name: Pytest

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: [self-hosted, agentek]

    steps:
      - uses: actions/checkout@v6
      - uses: windbit/shared-actions/checkout_submodules@master
        with:
          token: ${{ secrets.SUBMODULES_TOKEN }}
          paths: py-core
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra test --frozen
      - name: Run pytest
        run: uv run pytest
